[project]
name = "flip-options-bot"
version = "0.1.0"
description = "0-14 DTE equity options paper-trading bot, Alpaca, idempotent close writes, broker-resident TP/SL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "flipphill" },
]
dependencies = [
  "alpaca-py>=0.43",
  "pandas>=2.0",
  "numpy>=1.26",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pyright>=1.1",
  "ruff>=0.4",
  "streamlit>=1.30",
]

[project.scripts]
flip-options-bot = "flip_options_bot.daemon:main"
flip-options-cli = "flip_options_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flip_options_bot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "integration: requires Alpaca paper creds",
  "slow: > 5s runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
reportMissingImports = "error"
reportMissingTypeStubs = false